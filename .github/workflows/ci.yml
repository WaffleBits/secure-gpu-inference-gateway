name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Gateway tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-redis.txt

      - name: Run tests
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
        run: python -m unittest discover -s tests

      - name: Verify demo-auth HTTP boundary
        run: python tests/run_demo_auth_fixture.py

      - name: Import app
        run: python -c "from gateway.app import app; print(app.title)"

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          cluster_name: gateway-smoke
          kubectl_version: v1.34.0

      - name: Build and load gateway image
        run: |
          docker build --tag secure-gpu-inference-gateway:0.1.0 .
          kind load docker-image secure-gpu-inference-gateway:0.1.0 --name gateway-smoke

      - name: Apply Kubernetes deployment
        run: |
          kubectl apply --filename deploy/kubernetes/gateway.yaml
          kubectl rollout status deployment/secure-gpu-inference-gateway --namespace secure-gpu-inference --timeout=180s

      - name: Verify live Kubernetes deployment
        run: python scripts/kubernetes_smoke.py
